name: Continuous Verification

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Build, test, package, and deploy dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Verify documentation and examples
        run: pnpm check:docs

      - name: Run unit tests
        run: pnpm test:unit

      - name: Run Workers integration tests
        run: pnpm test:integration

      - name: Verify ES Modules entry points
        run: node scripts/verify-esm.mjs

      - name: Verify generated Workers types
        run: pnpm check:worker-types

      - name: Verify npm package publish dry-runs
        run: pnpm check:packages

      - name: Verify Cloudflare sample deploy dry-run
        run: pnpm check:deploy
