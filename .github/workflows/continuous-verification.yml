name: Continuous Verification

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Build, test, package, and deploy dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Verify documentation and examples
        run: pnpm check:docs
      - name: Run tests and collect coverage
        run: pnpm test:coverage
      - name: Publish coverage summary
        if: ${{ !cancelled() }}
        run: pnpm coverage:summary
      - name: Upload coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports-${{ github.run_number }}
          path: |
            packages/core/coverage
            packages/client/coverage
            packages/testing/coverage
            packages/cloudflare/coverage
            examples/local-demo/coverage
          if-no-files-found: warn
          retention-days: 14
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          files: packages/core/coverage/lcov.info,packages/client/coverage/lcov.info,packages/testing/coverage/lcov.info,packages/cloudflare/coverage/lcov.info,examples/local-demo/coverage/lcov.info
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}


      - name: Verify ES Modules entry points
        run: node scripts/verify-esm.mjs

      - name: Verify generated Workers types
        run: pnpm check:worker-types

      - name: Verify npm package publish dry-runs
        run: pnpm check:packages

      - name: Verify Cloudflare sample deploy dry-run
        run: pnpm check:deploy
