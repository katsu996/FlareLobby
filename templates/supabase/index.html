<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FlareLobby Supabase Starter</title>
  </head>
  <body>
    <main>
      <h1>FlareLobby Supabase Starter</h1>
      <p>Supabase Auth と FlareLobby Worker を接続する最小サンプルです。</p>

      <section>
        <h2>ログイン</h2>
        <p id="auth-status" aria-live="polite">読み込み中</p>
        <label for="email">メールアドレス</label>
        <input id="email" type="email" autocomplete="username" />
        <label for="password">パスワード</label>
        <input id="password" type="password" autocomplete="current-password" />
        <button id="sign-in" type="button">ログイン</button>
        <button id="sign-out" type="button">ログアウト</button>
      </section>

      <section>
        <h2>招待ルーム</h2>
        <button id="create-room" data-requires-auth type="button">作成</button>
        <p>作成した招待コード: <code id="created-invitation">-</code></p>
        <label for="invitation-code">招待コード</label>
        <input id="invitation-code" type="text" autocomplete="off" />
        <button id="join-room" data-requires-auth type="button">参加</button>
        <button id="toggle-ready" data-requires-auth type="button" hidden>
          準備状態を切替
        </button>
        <button id="leave-room" data-requires-auth type="button">退出</button>
        <button id="close-room" data-requires-auth type="button" hidden>
          終了（ホスト）
        </button>
        <p id="room-status" aria-live="polite">ルーム未接続</p>
        <p id="ready-state" aria-live="polite">準備状態: -</p>
        <ul id="participants"></ul>
      </section>

      <section>
        <h2>1v1 マッチング</h2>
        <button id="join-queue" data-requires-auth type="button">参加</button>
        <button id="cancel-queue" data-requires-auth type="button">取消</button>
      </section>

      <section>
        <h2>ログ</h2>
        <div id="log" aria-live="polite"></div>
      </section>
    </main>
    <script type="module" src="/src/browser.ts"></script>
  </body>
</html>
